
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>CARE360+ Caregiver Check</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    body {
      margin: 0;
      padding: 30px 20px;
      background: #FFFBF7;
      color: #263F4C;
      font-family: Tahoma, Arial, sans-serif;
      text-align: center;
      font-size: 20px;
    }

    h1 {
      color: #087E88;
      font-size: 32px;
    }

    .card {
      margin-top: 30px;
      padding: 25px 20px;
      background: #EAF7FA;
      border-radius: 20px;
      line-height: 1.8;
      overflow-wrap: anywhere;
    }

    button {
      width: 100%;
      padding: 18px;
      margin-top: 20px;
      border: none;
      border-radius: 18px;
      background: #C43D70;
      color: white;
      font-size: 20px;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <h1>CARE360+</h1>
  <h2>Caregiver Check</h2>

  <div class="card">
    <div id="status">
      กำลังตรวจสอบการเชื่อมต่อ LINE...
    </div>
  </div>

  <button id="loginBtn"
          onclick="login()"
          style="display:none">
    เข้าสู่ระบบ LINE
  </button>

  <script>
    const LIFF_ID = "2011798945-3w7xHjec";

    async function initialize() {
      const status = document.getElementById("status");
      const loginBtn = document.getElementById("loginBtn");

      try {
        await liff.init({ liffId: LIFF_ID });

        if (!liff.isLoggedIn()) {
          status.textContent =
            "LIFF เริ่มทำงานสำเร็จ กรุณาเข้าสู่ระบบ LINE";
          loginBtn.style.display = "block";
          return;
        }

        const profile = await liff.getProfile();

        status.textContent =
          "เชื่อมต่อ LINE สำเร็จ ยินดีต้อนรับ " +
          profile.displayName;

      } catch (error) {
        status.textContent =
          "เชื่อมต่อไม่สำเร็จ: " +
          (error.message || String(error));
      }
    }

    function login() {
      liff.login();
    }

    window.addEventListener("load", initialize);
  </script>
</body>
</html>
